# Builds the WebAssembly loader and the web demo, then deploys the demo as a
# fully static site (no CDN, no runtime fetches of npm packages).
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["release"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 7.0.0

      - name: Install demo dependencies
        run: npm ci

      - name: Build WebAssembly module
        run: ./build.sh

      - name: Build static demo (bundles three.js and the wasm binary)
        run: npm run dev:build

      - name: Verify deployment artifact contents
        run: |
          test -f .vite-demo-dist/index.html
          ls .vite-demo-dist/assets/tinyobj-*.wasm
          if grep -q 'cdn.jsdelivr' .vite-demo-dist/index.html; then
            echo 'error: built demo still references a CDN' >&2
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/.vite-demo-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
