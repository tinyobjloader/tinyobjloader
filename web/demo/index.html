<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tinyobj — WebAssembly OBJ viewer</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101216;
        --panel: #191d23;
        --line: #2b323c;
        --text: #e6e9ee;
        --muted: #98a2b2;
        --accent: #7cc4ff;
        --error: #ff8b8b;
        --warn: #ffd479;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          sans-serif;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      header,
      #toolbar {
        position: fixed;
        left: 16px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        background: color-mix(in srgb, var(--panel) 88%, transparent);
        border: 1px solid var(--line);
        border-radius: 10px;
        backdrop-filter: blur(6px);
      }
      header {
        top: 16px;
        flex-wrap: wrap;
      }
      #toolbar {
        top: 78px;
        flex-wrap: wrap;
        font-size: 13px;
      }
      header strong {
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      header span,
      #toolbar label {
        color: var(--muted);
      }
      .github {
        color: var(--accent);
        text-decoration: none;
        border-bottom: 1px solid transparent;
      }
      .github:hover {
        border-bottom-color: var(--accent);
      }
      button,
      select {
        font: inherit;
        color: var(--text);
        background: #232a33;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 12px;
        cursor: pointer;
      }
      select {
        padding: 4px 8px;
      }
      button:hover,
      select:hover {
        border-color: var(--accent);
      }
      button:focus-visible,
      select:focus-visible,
      .github:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #status {
        position: fixed;
        inset: auto 16px 16px 16px;
        max-height: 25vh;
        overflow: auto;
        padding: 10px 14px;
        background: color-mix(in srgb, var(--panel) 88%, transparent);
        border: 1px solid var(--line);
        border-radius: 10px;
        color: var(--muted);
        white-space: pre-wrap;
        backdrop-filter: blur(6px);
      }
      #status[data-kind="error"] {
        color: var(--error);
      }
      #status[data-kind="warn"] {
        color: var(--warn);
      }
      #panel {
        position: fixed;
        top: 16px;
        right: 16px;
        bottom: 16px;
        width: 310px;
        overflow: auto;
        padding: 14px;
        background: color-mix(in srgb, var(--panel) 94%, transparent);
        border: 1px solid var(--line);
        border-radius: 10px;
        backdrop-filter: blur(6px);
      }
      .tabs {
        display: flex;
        gap: 6px;
        margin-bottom: 12px;
      }
      .tab {
        flex: 1;
        padding: 6px 8px;
        font-size: 12px;
      }
      .tab.active {
        border-color: var(--accent);
        color: var(--accent);
      }
      #panel h3 {
        margin: 16px 0 8px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .shape-row {
        display: block;
        width: 100%;
        margin-bottom: 4px;
        padding: 6px 8px;
        font-size: 12px;
        text-align: left;
      }
      .shape-row.selected {
        border-color: var(--accent);
        color: var(--accent);
        background: #1e2a36;
      }
      .material {
        padding: 10px 0;
        border-top: 1px solid var(--line);
      }
      .material:first-child {
        border-top: 0;
        padding-top: 0;
      }
      .material-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        margin-bottom: 6px;
        word-break: break-all;
      }
      .swatch {
        width: 14px;
        height: 14px;
        flex: 0 0 auto;
        border: 1px solid var(--line);
        border-radius: 4px;
      }
      .material dl {
        display: grid;
        grid-template-columns: 58px 1fr;
        gap: 2px 8px;
        margin: 0;
        font-size: 12px;
        color: var(--muted);
      }
      .material dt {
        color: var(--accent);
      }
      .material dd {
        margin: 0;
        word-break: break-all;
      }
      .empty {
        color: var(--muted);
        font-size: 13px;
      }
      #dropzone {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: color-mix(in srgb, var(--bg) 70%, transparent);
        border: 2px dashed var(--accent);
        color: var(--accent);
        font-size: 16px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 120ms ease;
      }
      body[data-dragging="true"] #dropzone {
        opacity: 1;
      }
      #hint {
        position: fixed;
        inset: auto auto 16px 50%;
        transform: translateX(-50%);
        color: var(--muted);
      }
      @media (max-width: 900px) {
        #panel {
          top: auto;
          left: 16px;
          width: auto;
          max-height: 30vh;
        }
        #hint {
          display: none;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>

    <header>
      <strong>tinyobj</strong>
      <a
        class="github"
        href="https://github.com/tinyobjloader/tinyobjloader"
        target="_blank"
        rel="noopener noreferrer"
        >GitHub ↗</a
      >
      <span>C11 loader → WebAssembly</span>
      <button id="pick" type="button">Choose .obj</button>
      <button id="pick-folder" type="button">Choose folder</button>
      <input id="files" type="file" accept=".obj,.mtl,.png,.jpg,.jpeg,.webp,.gif,.bmp" multiple hidden />
      <input id="folder" type="file" webkitdirectory directory multiple hidden />
    </header>

    <div id="toolbar">
      <label>
        Shading
        <select id="shading">
          <option value="smooth">Smooth</option>
          <option value="flat">Flat</option>
          <option value="wireframe">Wireframe</option>
        </select>
      </label>
      <label><input id="textures" type="checkbox" checked /> Textures</label>
      <label>
        Subdiv
        <select id="subdiv">
          <option value="0">0</option>
          <option value="1">1</option>
          <option value="2">2</option>
        </select>
      </label>
      <label>
        Heatmap
        <select id="bone" disabled><option value="-1">Off</option></select>
      </label>
      <button id="play" type="button" disabled>▶</button>
      <input id="timeline" type="range" min="0" max="1000" value="0" disabled />
      <span id="time">0.00s</span>
      <button id="reset" type="button">Reset view</button>
    </div>

    <aside id="panel">
      <div class="tabs">
        <button id="tab-shapes" class="tab active" type="button">Shapes</button>
        <button id="tab-materials" class="tab" type="button">Materials</button>
      </div>
      <div id="shapes-view">
        <div id="shapes" class="empty">No model loaded</div>
        <section id="selection" hidden>
          <h3>Selected shape</h3>
          <div id="selection-detail"></div>
          <h3>Materials in shape</h3>
          <div id="selection-materials"></div>
        </section>
      </div>
      <div id="materials-view" hidden>
        <div id="materials" class="empty">No model loaded</div>
      </div>
    </aside>

    <div id="hint">Drop an .obj, folder, or images anywhere</div>
    <div id="status" role="status" aria-live="polite">Loading WebAssembly…</div>
    <div id="dropzone">Drop .obj / .mtl / textures / folder to load</div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
