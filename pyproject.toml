[build-system]

requires = [
    # NOTE: setuptools_scm>=8 is not supported in py3.6 cibuildwheel env.
    # so use older setuptools_scm for a while
    #"setuptools>=64",
    #"setuptools_scm>=8",
    "setuptools>=45",
    "setuptools_scm[toml]<8",
    "wheel",
    "pybind11>=2.10.0",
]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 140
force-exclude = '''
(
    /deps/.*$
    | /kuroga.py$
    | /config-msvc.py$
    | /config-posix.py$
    | ^python/build/.*$
    | ^python/dist/.*$
    | ^python/tinyobjloader.egg-info/.*$
)
'''

[project]
name = "tinyobjloader"
license = { text = "MIT AND ISC" }

# version: Use setuptools_scm
dynamic = ["version", "classifiers", "authors", "description"]


readme = {file = "README.md", content-type = "text/markdown"}

# Project URLs in pyproject.toml is not mature.
# so write it to setup.py
# https://github.com/pypa/packaging-problems/issues/606
#
# [project.urils]


[tool.setuptools_scm]
# setuptools_scm>=8
#version_file = "python/_version.py"

# setuptools_scm<8
write_to = "python/_version.py"

[tool.cibuildwheel]
# Disable aarch64 build since it's too slow to build(docker + qemu).
#
# cibuildwheel v4 notes:
#   * v4 no longer builds CPython 3.8, so the "cp38-*" skip is redundant but
#     harmless; it is kept so an older cibuildwheel still behaves the same.
#   * v4.2+ builds CPython 3.15 by default, and v4 has free-threaded builds
#     (cp314t/cp315t). This project is not free-threading ready, so skip those
#     explicitly; otherwise CI starts producing t-wheels.
skip = ["cp38-*", "cp314t-*", "cp315t-*", "*_aarch64*"]

# This extension module is not abi3 and doesn't use the limited API, so v4's
# default "abi3audit --strict --report {abi3_wheel}" audit would be pointless
# (it skips non-abi3 wheels anyway, but pinning the option makes the intent
# explicit and avoids installing abi3audit at all).
audit-command = ""
